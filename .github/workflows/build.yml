name: Gecord - Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-android:
    name: Construire Gecord pour Android
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Préparer la configuration Android
        shell: bash
        run: |
          set -euo pipefail

          echo "Contenu de la racine du dépôt :"
          ls -la

          test -f main.py || {
            echo "::error::main.py introuvable à la racine du dépôt."
            exit 1
          }

          if [ ! -f buildozer.spec ]; then
            echo "::warning::buildozer.spec introuvable : génération d'un fichier par défaut."

            cat > buildozer.spec <<'SPEC'
          [app]
          title = Gecord
          package.name = gecord
          package.domain = org.shampooingbon
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,txt,ttf
          source.exclude_dirs = .git,.github,bin,release,.buildozer
          version = 0.1
          requirements = python3,kivy,requests,urllib3,idna,charset-normalizer,certifi
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          p4a.branch = develop

          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPEC
          fi

          grep -q '^\[app\]' buildozer.spec || {
            echo "::error::buildozer.spec ne contient pas de section [app]."
            exit 1
          }

          # Accepter la licence Android sans modifier le fichier du dépôt.
          sed -i '/^[[:space:]]*#\{0,1\}[[:space:]]*android\.accept_sdk_license[[:space:]]*=/d' buildozer.spec
          sed -i '0,/^\[app\]/s//[app]\nandroid.accept_sdk_license = True/' buildozer.spec

          ensure_key() {
            key="$1"
            value="$2"

            if ! grep -Eq "^[[:space:]]*${key//./\\.}[[:space:]]*=" buildozer.spec; then
              echo "::notice::Ajout de '$key = $value' pour cette compilation."
              sed -i "0,/^\[app\]/s//[app]\n$key = $value/" buildozer.spec
            fi
          }

          ensure_key title Gecord
          ensure_key package.name gecord
          ensure_key package.domain org.shampooingbon
          ensure_key source.dir .
          ensure_key version 0.1
          ensure_key android.archs arm64-v8a
          ensure_key android.build_tools_version 34.0.0
          ensure_key p4a.branch develop

          # Requests et ses dépendances.
          REQ="$(grep -E '^[[:space:]]*requirements[[:space:]]*=' buildozer.spec || true)"
          echo "Requirements détectés : $REQ"

          if echo "$REQ" | grep -qi 'requests'; then
            for dep in urllib3 idna certifi; do
              if ! echo "$REQ" | grep -qi "$dep"; then
                echo "::notice::Ajout de $dep aux requirements Android."
                sed -i -E "/^[[:space:]]*requirements[[:space:]]*=/ s/$/,$dep/" buildozer.spec
              fi
            done

            # Chardet est une alternative Python pur pour l'encodage utilisé par requests.
            if ! grep -E '^[[:space:]]*requirements[[:space:]]*=' buildozer.spec | grep -qi 'chardet'; then
              sed -i -E '/^[[:space:]]*requirements[[:space:]]*=/ s/$/,chardet==5.2.0/' buildozer.spec
            fi

            sed -i -E '/^[[:space:]]*requirements[[:space:]]*=/ s/charset-normalizer(==[0-9.]+)?/chardet==5.2.0/' buildozer.spec
          fi

          echo "--- buildozer.spec utilisé ---"
          cat buildozer.spec

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les dépendances système
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            python3-pip python3-venv \
            autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Restaurer le cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-android-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-android-v3-${{ runner.os }}-

      - name: Installer Buildozer et ses dépendances
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$HOME/venv-buildozer"
          source "$HOME/venv-buildozer/bin/activate"

          python -m pip install --upgrade pip wheel "setuptools<81"
          python -m pip install \
            Cython==0.29.36 \
            buildozer \
            sh appdirs colorama jinja2 \
            build toml packaging virtualenv \
            pyproject-hooks

          python -c "import sh, appdirs, colorama, jinja2, build, pyproject_hooks; print('Dépendances hôte OK')"
          buildozer --version

      - name: Compiler l'APK avec journal détaillé
        shell: bash
        run: |
          set -o pipefail
          source "$HOME/venv-buildozer/bin/activate"

          buildozer -v android debug 2>&1 | tee android-build.log

      - name: Afficher les erreurs de compilation
        if: failure()
        shell: bash
        run: |
          if [ -f android-build.log ]; then
            echo "===== Dernières lignes du journal Android ====="
            tail -n 160 android-build.log || true

            echo "===== Erreurs repérées ====="
            grep -n -i -E \
              'error|failed|traceback|exception|not found|no matching distribution' \
              android-build.log | tail -n 60 || true
          fi

      - name: Publier le journal Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gecord-Android-Logs
          path: android-build.log
          if-no-files-found: ignore

      - name: Vérifier et préparer l'APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Aucun APK n'a été produit."
            exit 1
          fi

          cp "$APK" release/Gecord-Android.apk
          test -s release/Gecord-Android.apk

          echo "APK créé : release/Gecord-Android.apk"
          ls -lh release/Gecord-Android.apk

      - name: Publier la version Android
        uses: actions/upload-artifact@v4
        with:
          name: Gecord-Android
          path: release/Gecord-Android.apk
          if-no-files-found: error
```
