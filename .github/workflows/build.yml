name: Gecorde - Compilation multiplateforme

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. WINDOWS - NOUVELLE COMPILATION
  # ==========================================
  build-windows:
    name: Construire Gecorde pour Windows
push:
  branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    name: Construire Gecorde pour Windows
    runs-on: windows-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installer les dépendances et PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller requests certifi

      - name: Compiler l'exécutable Windows avec PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name Gecorde-Windows main.py

      - name: Vérifier et préparer l'exécutable
        shell: bash
        run: |
          mkdir -p release
          if [ ! -f "dist/Gecorde-Windows.exe" ]; then
            echo "ERREUR : aucun exécutable Windows produit."
            exit 1
          fi
          cp dist/Gecorde-Windows.exe release/Gecorde-Windows.exe
          test -s release/Gecorde-Windows.exe

      - name: Publier la version Windows
        uses: actions/upload-artifact@v4
        with:
          name: Gecorde-Windows
          path: release/Gecorde-Windows.exe
          if-no-files-found: error

  # ==========================================
  # 2. LINUX - CONSERVÉ À L'IDENTIQUE
  # ==========================================
  build-linux:
    name: Construire Gecorde pour Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-dev \
            build-essential \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libmtdev-dev \
            libasound2-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libwayland-dev \
            libwayland-egl1 \
            libegl1 \
            libglib2.0-0

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install kivy requests pyinstaller

      - name: Compiler Gecorde
        run: |
          pyinstaller --noconfirm --clean --onefile --name Gecorde main.py

      - name: Préparer le téléchargement Linux
        run: |
          mkdir -p release
          cp dist/Gecorde release/Gecorde-Linux
          chmod +x release/Gecorde-Linux
          cd release
          tar -czf Gecorde-Linux.tar.gz Gecorde-Linux

      - name: Publier la version Linux
        uses: actions/upload-artifact@v4
        with:
          name: Gecorde-Linux
          path: release/Gecorde-Linux.tar.gz
          if-no-files-found: error


  # ==========================================
  # 3. ANDROID - COMPILATION ET DIAGNOSTIC
  # ==========================================
  build-android:
   name: Construire Gecorde pour Android
push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
build-android:
    name: Construire Gecorde pour Android
    runs-on: ubuntu-22.04

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Vérifier la configuration Android
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "ERREUR : buildozer.spec est introuvable."
            exit 1
          fi
          if [ ! -f main.py ]; then
            echo "ERREUR : main.py est introuvable."
            exit 1
          fi

      - name: Installer les dépendances système et 32-bit libs
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            libc6:i386 libstdc++6:i386 zlib1g:i386

      - name: Installer Buildozer et dépendances Python
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install --upgrade cython
          pip install buildozer

      - name: Compiler l'APK avec journal détaillé
        shell: bash
        run: |
          set -o pipefail
          source .venv/bin/activate
          buildozer -v android debug 2>&1 | tee android-build.log

      - name: Publier le journal de compilation Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gecorde-Android-Logs
          path: android-build.log
          if-no-files-found: ignore

      - name: Vérifier et préparer l'APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK produit."
            exit 1
          fi
          cp "$APK" release/Gecorde-Android.apk
          test -s release/Gecorde-Android.apk

      - name: Publier la version Android
        uses: actions/upload-artifact@v4
        with:
          name: Gecorde-Android
          path: release/Gecorde-Android.apk
          if-no-files-found: error
