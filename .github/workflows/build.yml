name: Gecorde - Compilation multiplateforme

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. WINDOWS
  # ==========================================
  build-windows:
    name: Construire Gecorde pour Windows
    runs-on: windows-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install kivy requests pyinstaller

      - name: Compiler Gecorde
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Gecorde main.py

      - name: Publier la version Windows
        uses: actions/upload-artifact@v4
        with:
          name: Gecorde-Windows
          path: dist/Gecorde.exe
          if-no-files-found: error


  # ==========================================
  # 2. LINUX
  # ==========================================
  build-linux:
    name: Construire Gecorde pour Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-dev \
            build-essential \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libmtdev-dev \
            libasound2-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libwayland-dev \
            libwayland-egl1 \
            libegl1 \
            libglib2.0-0

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install kivy requests pyinstaller

      - name: Compiler Gecorde
        run: |
          pyinstaller --noconfirm --clean --onefile --name Gecorde main.py

      - name: Préparer le téléchargement Linux
        run: |
          mkdir -p release
          cp dist/Gecorde release/Gecorde-Linux
          chmod +x release/Gecorde-Linux
          cd release
          tar -czf Gecorde-Linux.tar.gz Gecorde-Linux

      - name: Publier la version Linux
        uses: actions/upload-artifact@v4
        with:
          name: Gecorde-Linux
          path: release/Gecorde-Linux.tar.gz
          if-no-files-found: error


  # ==========================================
  # 3. ANDROID
  # ==========================================
  build-android:
    name: Construire Gecorde pour Android
    runs-on: ubuntu-22.04

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Installer Buildozer
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Compiler l'APK
        run: |
          . .venv/bin/activate
          buildozer android debug

      - name: Préparer le téléchargement Android
        run: |
          mkdir -p release
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" release/Gecorde-Android.apk

      - name: Publier la version Android
        uses: actions/upload-artifact@v4
        with:
          name: Gecorde-Android
          path: release/Gecorde-Android.apk
          if-no-files-found: error


  # ==========================================
  # 4. IOS
  # ==========================================
  build-ios:
    name: Construire Gecorde pour iPhone et iPad
    runs-on: macos-15

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérifier Xcode
        run: |
          xcodebuild -version

      # La compilation réelle sera ajoutée lorsque
      # la configuration Kivy-iOS et la signature Apple
      # seront prêtes.
