name: Gecord - Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-android:
    name: Construire Gecord pour Android
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Préparer la configuration Android
        shell: bash
        run: |
          echo "Contenu de la racine du dépôt :"
          ls -la

          test -f main.py || { echo "::error::main.py introuvable à la racine du dépôt."; exit 1; }

          if [ ! -f buildozer.spec ]; then
            echo "::warning::buildozer.spec introuvable : un fichier par défaut est généré pour cette compilation. Ajoutez un vrai buildozer.spec au dépôt."
            cat > buildozer.spec <<'SPEC'
          [app]
          title = Gecord
          package.name = gecord
          package.domain = org.shampooingbon
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,txt,ttf
          source.exclude_dirs = .git,.github,bin,release,.buildozer
          version = 0.1
          requirements = python3,kivy,requests,urllib3,idna,charset-normalizer,certifi
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 21
          android.archs = arm64-v8a, armeabi-v7a
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPEC
          fi

          # La licence du SDK Android doit être acceptée, sinon Buildozer attend une réponse
          # au clavier et reste bloqué. On corrige la copie du fichier sur le runner seulement
          # (le fichier du dépôt n'est pas modifié).
          grep -q '^\[app\]' buildozer.spec || { echo "::error::buildozer.spec ne contient pas de section [app]."; exit 1; }
          sed -i '/^[[:space:]]*#\{0,1\}[[:space:]]*android\.accept_sdk_license[[:space:]]*=/d' buildozer.spec
          sed -i '0,/^\[app\]/s//[app]\nandroid.accept_sdk_license = True/' buildozer.spec

          # Lignes obligatoires pour Buildozer : on ajoute celles qui manquent (copie du runner seulement).
          ensure_key() {
            key="$1"; value="$2"
            if ! grep -Eq "^[[:space:]]*${key//./\\.}[[:space:]]*=" buildozer.spec; then
              echo "::warning::'$key' manquant dans buildozer.spec : ajout de '$key = $value' pour cette compilation. Ajoute cette ligne dans ton fichier."
              sed -i "0,/^\[app\]/s//[app]\n$key = $value/" buildozer.spec
            fi
          }
          ensure_key title Gecord
          ensure_key package.name gecord
          ensure_key package.domain org.shampooingbon
          ensure_key source.dir .
          ensure_key version 0.1
          # Un seul processeur (64 bits, tous les téléphones récents) : build plus court et moins de risques d'erreur.
          ensure_key android.archs arm64-v8a

          REQ="$(grep -E '^[[:space:]]*requirements[[:space:]]*=' buildozer.spec || true)"
          echo "Requirements détectés : $REQ"
          echo "$REQ" | grep -qi 'kivy' || echo "::warning::'kivy' n'apparaît pas dans requirements."
          if echo "$REQ" | grep -qi 'requests'; then
            for dep in urllib3 idna charset-normalizer certifi; do
              if ! echo "$REQ" | grep -qi "$dep"; then
                echo "::warning::'requests' est utilisé mais '$dep' manque dans requirements : ajouté pour cette compilation (sinon l'APK plante au lancement). Ajoute-le dans ton fichier."
                sed -i -E "s/^([[:space:]]*requirements[[:space:]]*=.*)$/\1,$dep/" buildozer.spec
              fi
            done
          fi

          echo "--- buildozer.spec utilisé ---"
          cat buildozer.spec

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
