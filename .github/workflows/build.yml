name: Compiler Gecord en APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: 🧩 Créer le fichier buildozer.spec
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Gecord
          package.name = gecord
          package.domain = com.gecord
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,txt,ini,json
          version = 0.1
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 31
          android.minapi = 21
          android.archs = arm64-v8a

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: 🔨 Compiler avec Buildozer
        uses: kivy/buildozer-action@v1
        with:
          command: android debug
          trigger: push

      - name: 📤 Télécharger l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: gecord-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
