name: Compiler Gecord en APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: ☕ Installer Java Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🐍 Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            libgl1-mesa-dev \
            zlib1g-dev

      - name: 📦 Installer Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade cython buildozer

      - name: 🧩 Créer le fichier buildozer.spec
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Gecord
          package.name = gecord
          package.domain = com.gecord
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,txt,ini,json
          version = 0.1
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 31
          android.minapi = 21
          android.archs = arm64-v8a

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: 🔨 Compiler l'APK Android
        run: buildozer android debug

      - name: 📤 Télécharger l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: gecord-debug-apk
          path: ./bin/*.apk
          if-no-files-found: error
          retention-days: 30
