name: Gecord - Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Construire Gecord pour Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Vérifier le dépôt
        shell: bash
        run: |
          echo "Contenu de la racine du dépôt :"
          ls -la
          test -f main.py || { echo "::error::main.py introuvable à la racine du dépôt."; exit 1; }

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Kivy + ses bibliothèques Windows (SDL2, GLEW, ANGLE)
          pip install "kivy[base]" pyinstaller requests certifi
          # Si le dépôt a un requirements.txt, on l'installe aussi.
          if [ -f requirements.txt ]; then
            echo "requirements.txt trouvé, installation..."
            pip install -r requirements.txt
          fi
          pip list

      - name: Générer le fichier de build PyInstaller
        shell: bash
        run: |
          cat > gecord-windows.spec <<'SPEC'
          # -*- mode: python ; coding: utf-8 -*-
          import os

          # Bibliothèques Windows de Kivy (selon la version de Kivy, elles peuvent être absentes).
          try:
              from kivy_deps import sdl2, glew
              kivy_deps_trees = [Tree(p) for p in (sdl2.dep_bins + glew.dep_bins)]
              try:
                  from kivy_deps import angle
                  kivy_deps_trees += [Tree(p) for p in angle.dep_bins]
              except Exception:
                  pass
          except Exception:
              kivy_deps_trees = []

          # Fichiers du projet à embarquer (images, .kv, polices, json...), hors fichiers techniques.
          EXCLUDE_DIRS = {'.git', '.github', 'build', 'dist', 'release', '.buildozer',
                          'bin', '__pycache__', 'venv', '.venv', 'env'}
          DATA_EXTS = {'.png', '.jpg', '.jpeg', '.gif', '.kv', '.atlas', '.json',
                       '.txt', '.ttf', '.otf', '.wav', '.mp3', '.ogg', '.ico'}
          datas = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in EXCLUDE_DIRS]
              for f in files:
                  if os.path.splitext(f)[1].lower() in DATA_EXTS and f != 'requirements.txt':
                      src = os.path.join(root, f)
                      dest = os.path.normpath(root)
                      datas.append((src, dest))

          a = Analysis(
              ['main.py'],
              pathex=[],
              binaries=[],
              datas=datas,
              hiddenimports=['requests', 'certifi'],
              hookspath=[],
              runtime_hooks=[],
              excludes=[],
              noarchive=False,
          )
          pyz = PYZ(a.pure)

          exe = EXE(
              pyz,
              a.scripts,
              a.binaries,
              a.datas,
              *kivy_deps_trees,
              [],
              name='Gecord',
              debug=False,
              strip=False,
              upx=False,
              console=False,
              icon=None,
          )
          SPEC
          echo "--- gecord-windows.spec ---"
          cat gecord-windows.spec

      - name: Compiler l'exécutable avec journal détaillé
        shell: bash
        run: |
          set -o pipefail
          pyinstaller --noconfirm --clean gecord-windows.spec 2>&1 | tee windows-build.log

      - name: Afficher la fin du journal en cas d'échec
        if: failure()
        shell: bash
        run: |
          echo "===== 120 dernières lignes ====="
          tail -n 120 windows-build.log || true
          echo "===== Lignes contenant une erreur ====="
          grep -n -i -E 'error|failed|traceback|exception|not found' windows-build.log | tail -n 30 || true

      - name: Publier le journal Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gecord-Windows-Logs
          path: windows-build.log
          if-no-files-found: ignore

      - name: Vérifier et préparer l'exécutable
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/Gecord.exe || { echo "ERREUR : dist/Gecord.exe n'a pas été produit."; ls -la dist || true; exit 1; }
          mkdir -p release
          cp dist/Gecord.exe release/Gecord-Windows.exe
          ls -la release

      - name: Publier la version Windows
        uses: actions/upload-artifact@v4
        with:
          name: Gecord-Windows
          path: release/Gecord-Windows.exe
          if-no-files-found: error
